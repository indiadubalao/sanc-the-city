<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SANC — Protótipo 0.1</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14232c;font:14px system-ui,sans-serif;color:white;touch-action:none}canvas#world{width:100%;height:100%;display:block}#hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 4px #000}#brand{font-size:28px;font-weight:1000;letter-spacing:-1.5px;font-style:italic;background:linear-gradient(135deg,#52f5ec,#a69bff,#ff66b9);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:none}small{display:block;font-size:10px;letter-spacing:1px}#money{text-align:right;font-weight:800;font-size:20px}#zone{font-size:12px;font-weight:500}#mini{position:absolute;top:calc(env(safe-area-inset-top) + 73px);right:15px;width:100px;height:100px;border:2px solid #ffffff80;border-radius:12px;background:#17232b}#stick{position:absolute;left:20px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:126px;height:126px;border:1px solid #ffffff55;border-radius:50%;background:#101b28a6;touch-action:none}#knob{position:absolute;left:40px;top:40px;width:46px;height:46px;border-radius:50%;background:#c8e4e1a0;border:2px solid white;pointer-events:none}#buttons{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:12px}button{color:white;border:1px solid #ffffff77;background:#111b28d9;border-radius:28px;padding:14px;font:700 12px system-ui;touch-action:none;min-width:95px}button:active{background:#b23b82}#msg{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 155px);left:12%;right:12%;text-align:center;font-size:12px;text-shadow:0 2px 4px black;pointer-events:none}#hint{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:15px;font-size:10px;color:#fff;text-shadow:0 1px 4px black;max-width:50%}</style></head><body>
<canvas id="world"></canvas><div id="hud"><div><div id="brand">SANC</div><small>SANTA COSTA: THE CITY · 0.1</small></div><div id="money">R$ 250<div id="zone">Morrinhos</div></div></div><canvas id="mini" width="120" height="120"></canvas><div id="hint">Protótipo 2D • Morrinhos / Praia do Tombo</div><div id="stick"><div id="knob"></div></div><div id="buttons"><button id="run">CORRER</button><button id="action">INTERAGIR</button></div><div id="msg">Explore o bairro e encontre o carro azul.</div>
<script>
'use strict';const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),mini=document.querySelector('#mini').getContext('2d');const W=1500,H=1500;let vw=innerWidth,vh=innerHeight,dpr=1;function resize(){vw=innerWidth;vh=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=vw*dpr;canvas.height=vh*dpr}addEventListener('resize',resize);resize();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const p={x:700,y:345,a:Math.PI/2},car={x:750,y:810,a:Math.PI/2};let driving=false,running=false,money=250,msgUntil=0;const blocks=[],roads=[],trees=[];function rect(x,y,w,h,color){blocks.push({x,y,w,h,color})}function road(x,y,w,h){roads.push({x,y,w,h})}road(0,780,1500,64);road(0,1120,1500,72);road(690,100,90,1020);road(340,640,60,480);road(1090,640,60,480);road(0,590,1500,45);for(let r=0;r<6;r++)for(let c=0;c<14;c++){const x=70+c*100+(r%2)*18,y=100+r*75;if(x+65>670&&x<800)continue;rect(x,y,57+(c%3)*5,44,['#a65c43','#c57c60','#8b8988','#d5b18b','#baaca0'][(r+c)%5])}for(let r=0;r<3;r++)for(let c=0;c<9;c++){let x=35+c*163,y=865+r*79;if([340,690,1090].some(a=>x+88>a-12&&x<a+92))continue;rect(x,y,83,53,['#d1c7b4','#b5b9ba','#9baeb5'][c%3])}for(let i=0;i<25;i++)trees.push({x:28+i*60,y:1210+(i%3)*13});for(let i=0;i<15;i++)trees.push({x:20+i*100,y:48+(i%3)*10});const shop={x:895,y:850};function hit(x,y){return x<15||x>W-15||y<15||y>1370||blocks.some(b=>x>b.x-9&&x<b.x+b.w+9&&y>b.y-9&&y<b.y+b.h+9)}function notify(t){document.querySelector('#msg').textContent=t;msgUntil=performance.now()+3500}function action(){if(driving){driving=false;p.x=car.x+22;p.y=car.y;if(hit(p.x,p.y))p.x=car.x;notify('Você saiu do veículo.')}else if(Math.hypot(p.x-car.x,p.y-car.y)<85){driving=true;notify('Veículo ligado.')}else if(Math.hypot(p.x-shop.x,p.y-shop.y)<85){if(money>=10){money-=10;notify('Você comprou um lanche por R$ 10.')}else notify('Saldo insuficiente.')}else notify('Aproxime-se de um veículo ou comércio.')}document.querySelector('#action').onclick=action;const run=document.querySelector('#run');run.onpointerdown=e=>{e.preventDefault();run.setPointerCapture(e.pointerId);running=true};run.onpointerup=run.onpointercancel=()=>running=false;let joy={x:0,y:0},pid=null;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');function move(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,m=Math.max(1,Math.hypot(x,y)/40);joy={x:x/m/40,y:y/m/40};knob.style.transform=`translate(${joy.x*40}px,${joy.y*40}px)`}stick.onpointerdown=e=>{e.preventDefault();pid=e.pointerId;stick.setPointerCapture(pid);move(e)};stick.onpointermove=e=>{if(e.pointerId===pid)move(e)};stick.onpointerup=stick.onpointercancel=()=>{pid=null;joy={x:0,y:0};knob.style.transform='none'};let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e'&&!e.repeat)action()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function fill(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function drawMap(){fill('#53684e',0,0,W,H);fill('#87927d',0,575,W,545);fill('#cfc6a7',0,1192,W,45);fill('#e0ca99',0,1237,W,135);fill('#288b9b',0,1372,W,128);for(let i=0;i<6;i++)fill('#ffffff22',0,1378+i*13,W,3);for(const r of roads){fill('#b6b1a5',r.x-5,r.y-5,r.w+10,r.h+10);fill('#555a61',r.x,r.y,r.w,r.h);ctx.strokeStyle='#d5c6a3';ctx.lineWidth=2;ctx.setLineDash([15,14]);ctx.beginPath();if(r.w>r.h){ctx.moveTo(r.x,r.y+r.h/2);ctx.lineTo(r.x+r.w,r.y+r.h/2)}else{ctx.moveTo(r.x+r.w/2,r.y);ctx.lineTo(r.x+r.w/2,r.y+r.h)}ctx.stroke();ctx.setLineDash([])}for(const b of blocks){fill('#202c2b66',b.x+5,b.y+5,b.w,b.h);fill(b.color,b.x,b.y,b.w,b.h);fill('#ffffff22',b.x+3,b.y+3,b.w-6,7);fill('#34363888',b.x+5,b.y+b.h-7,b.w-10,3)}for(const t of trees){ctx.fillStyle='#283f33';ctx.beginPath();ctx.arc(t.x,t.y,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#618657';ctx.beginPath();ctx.arc(t.x-3,t.y-3,10,0,Math.PI*2);ctx.fill()}fill('#245b55',shop.x-18,shop.y-15,36,30);ctx.fillStyle='white';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('$',shop.x,shop.y+6);ctx.font='bold 23px system-ui';ctx.fillStyle='#ffffffb0';ctx.fillText('MORRINHOS',440,65);ctx.fillText('PRAIA DO TOMBO',850,1300)}function drawCar(){ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.a);fill('#20232b',-20,-11,40,22);fill('#46a5c6',-19,-9,38,18);fill('#193d55',-9,-7,12,14);fill('#a5c9db',7,-7,7,14);ctx.restore()}function drawPlayer(){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#17272e';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f6c29c';ctx.beginPath();ctx.arc(3,0,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(6,-4);ctx.lineTo(6,4);ctx.fill();ctx.restore()}let last=performance.now();function frame(t){const dt=Math.min((t-last)/1000,.04);last=t;let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),m=Math.max(1,Math.hypot(dx,dy));dx/=m;dy/=m;let target=driving?car:p,speed=driving?260:running||keys.shift?155:92;if(Math.hypot(dx,dy)>.05){target.a=Math.atan2(dy,dx);const nx=target.x+dx*speed*dt,ny=target.y+dy*speed*dt;if(!hit(nx,target.y)&&(!driving||target.y<1190))target.x=nx;if(!hit(target.x,ny)&&(!driving||ny<1190))target.y=ny}if(driving){p.x=car.x;p.y=car.y}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);let zoom=.85;ctx.save();ctx.translate(vw/2-p.x*zoom,vh/2-p.y*zoom);ctx.scale(zoom,zoom);drawMap();drawCar();if(!driving)drawPlayer();ctx.restore();mini.fillStyle='#53684e';mini.fillRect(0,0,120,120);mini.fillStyle='#d2be99';mini.fillRect(0,95,120,15);mini.fillStyle='#288b9b';mini.fillRect(0,110,120,10);mini.fillStyle='#85888b';for(const r of roads)mini.fillRect(r.x/W*120,r.y/H*120,r.w/W*120,r.h/H*120);mini.fillStyle='#ff69b7';mini.beginPath();mini.arc(p.x/W*120,p.y/H*120,3.5,0,Math.PI*2);mini.fill();mini.fillStyle='#fff';mini.font='10px system-ui';mini.fillText('N',5,12);document.querySelector('#money').firstChild.nodeValue='R$ '+money;document.querySelector('#zone').textContent=p.y<640?'Morrinhos':p.y<1192?'Bairro residencial':'Praia do Tombo';document.querySelector('#action').textContent=driving?'SAIR DO CARRO':Math.hypot(p.x-car.x,p.y-car.y)<85?'ENTRAR NO CARRO':'INTERAGIR';if(t>msgUntil&&msgUntil){document.querySelector('#msg').textContent='';msgUntil=0}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
